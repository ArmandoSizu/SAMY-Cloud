{% extends "_app.html" %}
{% block title %}Plataforma &middot; {{ BRAND_FULL }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <div class="surface surface-pad text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full"
         style="background: var(--color-accent-50); color: var(--color-accent-600);">
      {% include "_icons.html" with name="shield" %}
    </div>
    <h1 class="text-xl font-semibold">Administrador de plataforma</h1>
    <p class="mt-2 text-[var(--color-ink-500)]">
      Tu cuenta administra SAMY Cloud, no una tienda concreta.
    </p>
    <a href="{% url 'platform_admin:home' %}" class="btn btn-primary btn-block mt-5">
      Ir al panel de plataforma
    </a>
  </div>
</div>
{% endblock %}
