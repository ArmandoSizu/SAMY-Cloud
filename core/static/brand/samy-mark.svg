<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="SAMY Cloud">
  <title>SAMY Cloud</title>
  <!--
    Marca de SAMY Cloud.

    Concepto: una "S" construida con dos arcos desplazados que no se tocan.
    El hueco entre ambos arcos lee como el corte de una nube y, a la vez,
    como el flujo de una transaccion que entra y sale. Geometria pura, sin
    detalle fino, para que siga siendo legible a 16 px en la pestana del
    navegador y en el icono de la pantalla de inicio del celular.
  -->
  <rect width="40" height="40" rx="10" fill="#1F4FD8"/>
  <path d="M27.5 14.2c-1.4-2.1-3.9-3.4-6.8-3.4-4.1 0-7.2 2.4-7.2 5.6 0 2.9 2.2 4.6 6.3 5.4"
        fill="none" stroke="#FFFFFF" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M12.5 25.8c1.4 2.1 3.9 3.4 6.8 3.4 4.1 0 7.2-2.4 7.2-5.6 0-2.9-2.2-4.6-6.3-5.4"
        fill="none" stroke="#FFFFFF" stroke-width="3.1" stroke-linecap="round" opacity="0.82"/>
</svg>
