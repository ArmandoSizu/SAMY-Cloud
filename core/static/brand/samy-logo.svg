<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" role="img" aria-label="SAMY Cloud">
  <title>SAMY Cloud</title>
  <!--
    Lockup horizontal: marca + tipografia.

    "SAMY" lleva el peso visual (800, tracking cerrado, negro carbon).
    "Cloud" acompana en gris neutro y peso normal: complementa sin competir,
    tal como pide la guia de identidad.

    El texto va como <text> y no convertido a trazos para que herede la
    tipografia del sistema de diseno y se mantenga nitido en cualquier tamano.
  -->
  <rect width="40" height="40" rx="10" fill="#1F4FD8"/>
  <path d="M27.5 14.2c-1.4-2.1-3.9-3.4-6.8-3.4-4.1 0-7.2 2.4-7.2 5.6 0 2.9 2.2 4.6 6.3 5.4"
        fill="none" stroke="#FFFFFF" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M12.5 25.8c1.4 2.1 3.9 3.4 6.8 3.4 4.1 0 7.2-2.4 7.2-5.6 0-2.9-2.2-4.6-6.3-5.4"
        fill="none" stroke="#FFFFFF" stroke-width="3.1" stroke-linecap="round" opacity="0.82"/>

  <text x="52" y="27"
        font-family="Inter, 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="21" font-weight="800" letter-spacing="-0.9" fill="#0B0D12">SAMY</text>
  <text x="121" y="27"
        font-family="Inter, 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="21" font-weight="400" letter-spacing="-0.5" fill="#6B7280">Cloud</text>
</svg>
